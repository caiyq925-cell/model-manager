<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>模型供应商管理</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 列表页 -->
  <div id="list-view" class="page">
    <header class="topbar">
      <div class="title-wrap">
        <h1>模型供应商</h1>
        <span id="stat" class="subtitle"></span>
      </div>
      <div class="topbar-actions">
        <label class="switch-label">
          <span class="switch-label-text">显示已禁用</span>
          <input type="checkbox" id="show-disabled" />
          <span class="switch"></span>
        </label>
        <button id="btn-add" class="btn primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          新增供应商
        </button>
      </div>
    </header>
    <main class="content">
      <div id="cards" class="cards"></div>
      <div id="empty" class="empty hidden">
        <div class="empty-icon">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01"/></svg>
        </div>
        <p class="empty-title">还没有供应商</p>
        <p class="empty-sub">点击右上角「新增供应商」，填入 Base URL 和 API Key 即可开始</p>
      </div>
    </main>
  </div>

  <!-- 编辑页 -->
  <div id="editor-view" class="page hidden">
    <header class="topbar">
      <div class="title-wrap row">
        <button id="btn-back" class="btn ghost" title="返回列表">←</button>
        <h1 id="editor-title">新增供应商</h1>
      </div>
      <button id="btn-save" class="btn primary">保 存</button>
    </header>
    <div class="editor-body">
      <section class="panel">
        <div class="form-grid">
          <label class="field-label" for="f-name">名称</label>
          <input id="f-name" class="input" placeholder="例如 OpenAI / 硅基流动 / 本地服务" autocomplete="off" />

          <label class="field-label" for="f-base">Base URL</label>
          <input id="f-base" class="input" placeholder="https://api.openai.com（自动补 /v1；以 # 结尾按原样使用）" autocomplete="off" spellcheck="false" />

          <label class="field-label" for="f-key">API Key</label>
          <div class="key-row">
            <input id="f-key" class="input" type="password" placeholder="sk-...（填好后按回车或点右侧按钮）" autocomplete="off" spellcheck="false" />
            <button id="btn-key-show" class="btn">显示</button>
            <button id="btn-fetch" class="btn accent">获取模型列表</button>
          </div>
        </div>
        <div id="editor-error" class="error-banner hidden"></div>
      </section>

      <section class="panel grow">
        <div class="toolbar">
          <strong class="toolbar-title">模型列表</strong>
          <span id="model-stat" class="subtitle"></span>
          <div class="grow"></div>
          <input id="f-filter" class="input small" placeholder="筛选模型…" autocomplete="off" spellcheck="false" />
          <label class="switch-label" title="只显示测试通过的模型">
            <span class="switch-label-text">只看通过</span>
            <input type="checkbox" id="only-passed" />
            <span class="switch"></span>
          </label>
          <button id="btn-test-all" class="btn">测试全部</button>
          <button id="btn-check-passed" class="btn">一键勾选通过</button>
        </div>
        <div id="model-list" class="model-list">
          <div id="model-empty" class="model-empty">填写信息后按回车或点击「获取模型列表」</div>
        </div>
      </section>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="main.js"></script>
</body>
</html>
